<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loup-Garou: Maître du Jeu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Creepster&family=Special+Elite&family=Nosifer&family=Cinzel:wght@400..900&family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      /* Variables CSS pour le thème du jeu */
      :root {
        --color-primary: #06b6d4; /* cyan-500 */
        --color-primary-dark: #0891b2; /* cyan-600 */
        --color-danger: #ef4444; /* red-500 */
        --color-warning: #f59e0b; /* amber-500 */
        --color-success: #10b981; /* green-500 */
        --shadow-glow: 0 0 20px rgba(6, 182, 212, 0.3);
        --shadow-glow-red: 0 0 20px rgba(239, 68, 68, 0.3);
      }
      
      body {
        background-color: #111827; /* bg-gray-900 */
        color: #f3f4f6; /* text-gray-200 */
        font-family: 'Quattrocento Sans', sans-serif;
      }
      
      /* Polices personnalisées */
      .font-serif {
        font-family: 'Cinzel', serif;
      }
      
      .font-game {
        font-family: 'Permanent Marker', cursive;
        letter-spacing: 0.05em;
      }
      
      .font-creepy {
        font-family: 'Creepster', cursive;
        letter-spacing: 0.08em;
      }
      
      .font-typewriter {
        font-family: 'Special Elite', cursive;
        letter-spacing: 0.03em;
      }
      
      .font-horror {
        font-family: 'Nosifer', cursive;
        letter-spacing: 0.1em;
      }
      
      /* Animations et effets pour le jeu */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: var(--shadow-glow);
        }
        50% {
          box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
        }
      }
      
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-out;
      }
      
      .animate-pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }
      
      .animate-shake {
        animation: shake 0.3s ease-in-out;
      }
      
      /* Effet de texte lumineux pour les titres */
      .text-glow {
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.5),
                     0 0 20px rgba(6, 182, 212, 0.3),
                     0 0 30px rgba(6, 182, 212, 0.2);
      }
      
      .text-glow-red {
        text-shadow: 0 0 10px rgba(239, 68, 68, 0.5),
                     0 0 20px rgba(239, 68, 68, 0.3),
                     0 0 30px rgba(239, 68, 68, 0.2);
      }
      
      /* Boutons avec effet hover amélioré */
      .btn-game {
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      
      .btn-game::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }
      
      .btn-game:hover::before {
        width: 300px;
        height: 300px;
      }
      
      /* Cartes de rôle avec effet 3D */
      .card-3d {
        transform-style: preserve-3d;
        transition: transform 0.6s;
      }
      
      .card-3d:hover {
        transform: rotateY(10deg) rotateX(5deg);
      }
      
      /* Spinner personnalisé */
      @keyframes spin-glow {
        0% {
          transform: rotate(0deg);
          border-top-color: var(--color-primary);
        }
        50% {
          border-top-color: var(--color-primary-dark);
        }
        100% {
          transform: rotate(360deg);
          border-top-color: var(--color-primary);
        }
      }
      
      .animate-spin-glow {
        animation: spin-glow 1s linear infinite;
      }
    </style>
